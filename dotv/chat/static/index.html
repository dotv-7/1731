<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Hermes · dotv</title>
<style>

:root{--mono:ui-monospace,"JetBrains Mono","SF Mono","Cascadia Code",Menlo,Consolas,"Liberation Mono","Noto Sans Mono CJK SC","PingFang SC","Microsoft YaHei",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--mono);font-size:14px;line-height:1.6;background:var(--bg);color:var(--text);transition:background .2s,color .2s;-webkit-font-smoothing:antialiased}
/* ---------- themes ---------- */
body{--bg:#101014;--surface:#1a1a2e;--text:#FFF8DC;--dim:#9a9480;--accent:#FFBF00;--accent2:#FFD700;--border:#CD7F32;--ok:#8FBC8F;--err:#FF6B6B;--warn:#FF8C00;--sel:#3a3a55;--code:#15151f;--user:#4dabf7;--glow:none}
body{text-shadow:var(--glow)}
::selection{background:var(--sel)}
/* ---------- page chrome ---------- */
.app{width:100%;min-width:0;height:100dvh;display:flex;flex-direction:column;max-width:980px;margin:0 auto;padding:0 16px}
/* top status bar */
.bar{display:flex;align-items:center;gap:14px;padding:12px 0 10px;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--dim);flex-wrap:wrap}
.brand{color:var(--accent);font-weight:700;letter-spacing:.5px}
.badge{padding:1px 8px;border:1px solid currentColor;border-radius:4px;font-weight:600}
.badge.guest{color:var(--ok)}
.badge.owner{color:var(--warn)}
.conn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--ok);vertical-align:1px}
.conn.down::before{background:var(--err);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
/* log */
.log{flex:1;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;padding:14px 0 8px;scroll-behavior:smooth}
.log::-webkit-scrollbar{width:8px}.log::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.msg{margin:0 0 14px;white-space:normal;overflow-wrap:anywhere;min-width:0}
.msg pre{max-width:100%;overflow-x:auto}
.msg .who{color:var(--dim);font-size:12px;user-select:none}
.u{color:var(--user)}
.u .p{color:var(--accent);margin-right:8px;user-select:none}
.sys{color:var(--dim);font-size:13px}
.err{color:var(--err)}
.tool{color:var(--dim);font-size:12.5px;margin:2px 0 6px;border-left:2px solid var(--border);padding-left:10px}
.tool b{color:var(--accent);font-weight:600}
.tool .ok{color:var(--ok)}
.a p{margin:0 0 8px}
.a h3{margin:6px 0;color:var(--accent);font-size:14px}
.a ul{margin:0 0 8px;padding-left:20px}
.a code{background:var(--code);padding:1px 5px;border-radius:3px;color:var(--accent2)}
.a pre{position:relative;background:var(--code);border:1px solid var(--border);border-radius:6px;padding:10px 12px;overflow-x:auto;margin:6px 0 10px}
.a pre code{background:none;padding:0;color:var(--text)}
.a pre .lang{position:absolute;top:2px;right:8px;font-size:11px;color:var(--dim)}
.a table{border-collapse:collapse;margin:6px 0 10px;font-size:13px;display:block;overflow-x:auto}
.a th,.a td{border:1px solid var(--border);padding:4px 10px;text-align:left;white-space:nowrap}
.a th{color:var(--accent);background:var(--surface)}
.cursor{display:inline-block;width:.55em;height:1.1em;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(2) infinite;margin-left:1px}
.k{display:inline-block;border:1px solid var(--border);border-radius:3px;padding:0 5px;font-size:11.5px;color:var(--dim);text-shadow:none}
/* input */
.dock{position:relative;border-top:1px solid var(--border);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.line{display:flex;align-items:flex-start;gap:8px}
.line .p{color:var(--accent);font-weight:700;padding-top:1px;user-select:none}
textarea{flex:1;font:inherit;color:var(--text);background:transparent;border:0;outline:0;resize:none;min-height:22px;max-height:160px;padding:0;caret-color:var(--accent);text-shadow:var(--glow)}
textarea::placeholder{color:var(--dim);opacity:.8}
.hint{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:6px}
.menu{position:absolute;bottom:calc(100% - 4px);left:0;min-width:300px;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:5}
.menu.show{display:block}
.menu div{padding:4px 10px;border-radius:4px;display:flex;gap:14px;cursor:pointer}
.menu div span:first-child{color:var(--accent);min-width:88px}
.menu div span:last-child{color:var(--dim)}
.menu div.on{background:var(--sel)}
.send{display:none;font:inherit;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:6px;padding:2px 12px}

.bar a{color:var(--dim);text-decoration:none;border:1px solid var(--border);border-radius:4px;padding:1px 8px}
.bar a:hover{color:var(--accent)}
.bar .sp{flex:1}
@media (max-width:640px){.hint{display:none}.send{display:inline-block}.bar{gap:8px}.app{padding:0 10px}}

</style></head>
<body>
<div class="app">
  <div class="bar"><span class="brand">⚕ HERMES</span><span id="badge" class="badge guest">访客</span>
    <span id="conn" class="conn">已连接</span><span class="sp"></span><a id="boardLink" href="/board" hidden>上下文看板</a></div>
  <div id="log" class="log"></div>
  <div class="dock">
    <div id="menu" class="menu"></div>
    <div class="line"><span class="p">❯</span>
      <textarea id="in" rows="1" placeholder="输入消息，/ 查看命令" autofocus></textarea>
      <button id="send" class="send">发送</button></div>
    <div class="hint"><span><span class="k">Enter</span> 发送</span><span><span class="k">Shift+Enter</span> 换行</span>
      <span><span class="k">↑</span> 历史</span><span><span class="k">/</span> 命令</span><span><span class="k">Ctrl+C</span> 中断</span></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s), log=$('#log'), inp=$('#in'), menu=$('#menu');
let role='guest', busy=null, hist=JSON.parse(localStorage.getItem('dotv.hist')||'[]'), hi=-1, menuIdx=0;
const CMDS=[['/help','显示帮助'],['/new','开始新会话'],['/clear','清空屏幕'],['/whoami','当前身份'],
  ['/unlock','Owner 口令解锁'],['/lock','退回访客'],['/board','打开上下文看板（Owner）']];
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');}
function md(src){
  const out=[], lines=src.split('\n'); let i=0;
  while(i<lines.length){const l=lines[i];
    let m=l.match(/^```(\w*)/);
    if(m){const buf=[];i++;while(i<lines.length&&!lines[i].startsWith('```'))buf.push(lines[i++]);i++;
      out.push(`<pre>${m[1]?`<span class="lang">${esc(m[1])}</span>`:''}<code>${esc(buf.join('\n'))}</code></pre>`);continue;}
    if(/^\|.*\|\s*$/.test(l)&&i+1<lines.length&&/^\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      let h='<table><tr>'+row(l).map(c=>`<th>${inline(c)}</th>`).join('')+'</tr>';i+=2;
      while(i<lines.length&&/^\|.*\|\s*$/.test(lines[i]))h+='<tr>'+row(lines[i++]).map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>';
      out.push(h+'</table>');continue;}
    if(m=l.match(/^#{1,4}\s+(.*)/)){out.push(`<h3>${inline(m[1])}</h3>`);i++;continue;}
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){let h='<ul>';while(i<lines.length&&/^\s*([-*]|\d+\.)\s+/.test(lines[i]))
      h+=`<li>${inline(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/,''))}</li>`;out.push(h+'</ul>');continue;}
    if(!l.trim()){i++;continue;}
    const buf=[];while(i<lines.length&&lines[i].trim()&&!/^(```|#|\s*[-*]\s|\|)/.test(lines[i]))buf.push(lines[i++]);
    if(!buf.length)buf.push(lines[i++]);
    out.push(`<p>${buf.map(inline).join('<br>')}</p>`);}
  return out.join('');}
const key=()=> 'dotv.log.'+role;
let transcript=[];
function save(){localStorage.setItem(key(),JSON.stringify(transcript.slice(-300)));}
function render(e){const d=document.createElement('div');d.className='msg '+e.k;
  if(e.k==='u')d.innerHTML=`<span class="p">❯</span>${esc(e.t)}`;
  else if(e.k==='a')d.innerHTML=md(e.t)+(e.live?'<span class="cursor"></span>':'');
  else d.innerHTML=esc(e.t);
  log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
function push(e,persist=true){if(persist){transcript.push(e);save();}return render(e);}
function sys(t,cls='sys'){return push({k:cls,t},false);}
function restore(){log.innerHTML='';transcript=JSON.parse(localStorage.getItem(key())||'[]');transcript.forEach(render);
  if(!transcript.length)sys(role==='owner'?'Owner 会话：完整 memory 和工具。':'你好，我是 dotv 的 Hermes。这是访客会话，可以问我公开信息、让我搜索网页、看图或画图。输入 /help 查看命令。');}
function setRole(r){role=r;const b=$('#badge');b.className='badge '+r;b.textContent=r==='owner'?'Owner':'访客';
  $('#boardLink').hidden=r!=='owner';restore();}
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  let j={};try{j=await r.json()}catch{}; if(!r.ok)throw new Error(j.detail||r.status);return j;}
async function me(){try{const r=await fetch('/api/me');const j=await r.json();online(true);return j.role;}catch{online(false);return null;}}
let retry=0;
function online(ok){const c=$('#conn');c.className='conn'+(ok?'':' down');c.textContent=ok?'已连接':'重连中…';
  if(ok)retry=0;else setTimeout(me,Math.min(1000*2**retry++,15000));}
window.addEventListener('online',me);window.addEventListener('offline',()=>online(false));
async function send(text){
  push({k:'u',t:text});const e={k:'a',t:'',live:true};const el=render(e);
  const ctrl=new AbortController();busy=ctrl;
  try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text}),signal:ctrl.signal});
    if(!r.ok){let j={};try{j=await r.json()}catch{};throw new Error(j.detail||('HTTP '+r.status));}
    online(true);const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let p;while((p=buf.indexOf('\n\n'))>=0){const line=buf.slice(0,p);buf=buf.slice(p+2);
        if(!line.startsWith('data:'))continue;const d=JSON.parse(line.slice(5));
        if(d.t){e.t+=d.t;el.innerHTML=md(e.t)+'<span class="cursor"></span>';log.scrollTop=log.scrollHeight;}
        if(d.error)throw new Error(d.error);}}
  }catch(err){if(err.name==='AbortError')e.t+=(e.t?'\n\n':'')+'^C 已中断';else{e.t+=(e.t?'\n\n':'')+'⚠ '+err.message;if(err instanceof TypeError)online(false);}}
  finally{busy=null;delete e.live;el.innerHTML=md(e.t);transcript.push({k:'a',t:e.t});save();}}
async function command(c){const [name,...rest]=c.trim().split(/\s+/);const arg=rest.join(' ');
  if(name==='/help'){sys(CMDS.map(([a,b])=>a.padEnd(10)+b).join('\n'));}
  else if(name==='/clear'){log.innerHTML='';}
  else if(name==='/new'){await api('/api/new');transcript=[];save();restore();sys('已开始新会话。');}
  else if(name==='/whoami'){sys('当前身份：'+(role==='owner'?'Owner':'访客'));}
  else if(name==='/unlock'){if(!arg)return sys('用法：/unlock <口令>');
    try{await api('/api/unlock',{passphrase:arg});setRole('owner');sys('已解锁 Owner。');}catch(e){sys('解锁失败：'+e.message,'err');}}
  else if(name==='/lock'){await api('/api/lock');setRole('guest');sys('已退回访客。');}
  else if(name==='/board'){if(role!=='owner')return sys('只有 Owner 能打开看板。','err');location.href='/board';}
  else sys('未知命令：'+name,'err');}
function submit(){const t=inp.value.trim();if(!t||busy)return;inp.value='';fit();hideMenu();
  hist=hist.filter(h=>h!==t);hist.push(t);hist=hist.slice(-100);localStorage.setItem('dotv.hist',JSON.stringify(hist));hi=-1;
  if(t.startsWith('/'))command(t);else send(t);}
function fit(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,160)+'px';}
function matches(){const v=inp.value;return v.startsWith('/')&&!v.includes(' ')?CMDS.filter(([c])=>c.startsWith(v)):[];}
function showMenu(){const m=matches();if(!m.length)return hideMenu();menuIdx=Math.min(menuIdx,m.length-1);
  menu.innerHTML=m.map(([c,d],i)=>`<div class="${i===menuIdx?'on':''}" data-c="${c}"><span>${c}</span><span>${d}</span></div>`).join('');menu.classList.add('show');}
function hideMenu(){menu.classList.remove('show');menuIdx=0;}
menu.addEventListener('mousedown',e=>{const d=e.target.closest('[data-c]');if(d){e.preventDefault();inp.value=d.dataset.c+' ';hideMenu();inp.focus();}});
inp.addEventListener('input',()=>{fit();showMenu();});
inp.addEventListener('keydown',e=>{const open=menu.classList.contains('show'),m=matches();
  if(open&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();menuIdx=(menuIdx+(e.key==='ArrowDown'?1:-1)+m.length)%m.length;return showMenu();}
  if(open&&(e.key==='Tab'||(e.key==='Enter'&&m[menuIdx]&&inp.value!==m[menuIdx][0]))){e.preventDefault();inp.value=m[menuIdx][0]+(['/unlock'].includes(m[menuIdx][0])?' ':'');hideMenu();if(inp.value.endsWith(' '))return;return;}
  if(e.key==='Escape'){hideMenu();return;}
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();return submit();}
  if(e.key==='ArrowUp'&&!inp.value.includes('\n')&&hist.length&&(inp.selectionStart===0||hi>=0)){e.preventDefault();hi=hi<0?hist.length-1:Math.max(0,hi-1);inp.value=hist[hi];fit();}
  else if(e.key==='ArrowDown'&&hi>=0){e.preventDefault();hi++;if(hi>=hist.length){hi=-1;inp.value='';}else inp.value=hist[hi];fit();}});
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='c'&&busy&&!getSelection().toString()){e.preventDefault();busy.abort();}});
$('#send').addEventListener('click',submit);
me().then(r=>setRole(r||'guest'));
</script></body></html>
