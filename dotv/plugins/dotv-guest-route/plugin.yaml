name: dotv-guest-route
version: "0.1.0"
description: "Identity-based context isolation for messaging platforms (#527): only the owner's private DM reaches the owner profile. Every other inbound message (strangers' DMs, any group/channel/thread, even the owner's own messages in a public venue) is withheld from the owner agent and answered by the public profile through the local API server, so the private memory, files and tools never exist in that conversation. Fail-closed: when the public profile cannot answer, the message is dropped with a short notice; it is never passed to the owner agent."
author: "dotv-io"
provides_hooks:
  - pre_gateway_dispatch
config_schema:
  owners:
    type: list
    default: []
    description: "Owner identities as platform:user_id (e.g. telegram:7206705424). If empty, the first entry of each <PLATFORM>_ALLOWED_USERS env var is treated as the owner."
  public_profile:
    type: str
    default: "public"
    description: "Profile that answers everyone else, via /p/<profile>/v1 on the local API server."
  guest_rate_per_hour:
    type: int
    default: 20
    description: "Messages per hour accepted from one guest identity before replies are paused."
requires_env:
  - name: DOTV_PUBLIC_KEY
    description: "API_SERVER_KEY of the public profile (the guest entrance)."
    required: true
