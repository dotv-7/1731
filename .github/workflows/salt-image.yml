# Build and push the Hermes image with this project on top: <upstream version>-salt.N (manual only).
name: salt image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. v0.23.0-salt.1 (never latest; existing tags are never overwritten)"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/salts-secrets-hermes

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-salt\.[0-9]+$ ]] || { echo "tag must look like v0.23.0-salt.1"; exit 1; }

      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "$IMAGE:$TAG already exists; bump salt.N"; exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Write install stamp
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/write_install_stamp.py --output install-stamp.json --distribution docker \
            --update-mechanism external --source salt-ci --commit "$GITHUB_SHA" --display-version "$TAG"
          python3 scripts/ci/check_profile_archive_boundary.py

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
