name: Salt's Secrets tests

on:
  push:
    branches: [dotv]
    paths: ["salts_secrets/**", "demo/**", ".github/workflows/salts-secrets-tests.yml"]
  pull_request:
    paths: ["salts_secrets/**", "demo/**", ".github/workflows/salts-secrets-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install test dependencies
        run: python -m pip install -r demo/requirements-dev.txt
      - name: Run plugin and demo tests
        run: python -m pytest salts_secrets/tests demo -q

  canary-matrix:
    # Full chain: a real multiplexed gateway, the Telegram and Discord adapters against loopback stand-ins,
    # and a fake model; two guest rows run past the compaction limit. Fails on any unapproved canary.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '["messaging"]'
          test-environment: 'true'
      - name: Run the canary matrix
        run: '"$HERMES_PYTHON" demo/e2e/canary_matrix.py --report "$RUNNER_TEMP/isolation-report.md"'
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolation-report
          path: ${{ runner.temp }}/isolation-report.md
          if-no-files-found: ignore
