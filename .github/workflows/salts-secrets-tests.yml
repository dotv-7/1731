name: Salt's Secrets tests

on:
  push:
    branches: [dotv]
    paths: ["salts_secrets/**", "demo/**", ".github/workflows/salts-secrets-tests.yml"]
  pull_request:
    paths: ["salts_secrets/**", "demo/**", ".github/workflows/salts-secrets-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install test dependencies
        run: python -m pip install -r demo/requirements-dev.txt
      - name: Run plugin and demo tests
        run: python -m pytest salts_secrets/tests demo -q
